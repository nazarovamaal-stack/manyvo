<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1000" viewBox="0 0 1550 1000" role="img" aria-labelledby="title desc"><title id="title">C4 · L2 — Контейнеры и связи</title><desc id="desc">Веб-клиент и расширение отправляют API-запросы через Next.js в Go. Go использует PostgreSQL, Redis и OpenAI.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557367"/></marker></defs><rect width="1550" height="1000" fill="#f7f8f4"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20382f" text-anchor="start">C4 · L2 — Контейнеры и связи</text><rect x="30" y="110" width="1190" height="805" rx="18" fill="none" stroke="#6c8477" stroke-width="2" stroke-dasharray="9 6"/><text x="55" y="148" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#20382f" text-anchor="start">Manyvo · граница системы</text><text x="70" y="205" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">В БРАУЗЕРЕ</text><text x="505" y="205" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">В DOCKER COMPOSE</text><rect x="70" y="305" width="330" height="160" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="235.0" y="336" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Веб-клиент</text><text x="235.0" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: React / TypeScript]</text><text x="235.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Интерфейс заказчика</text><text x="235.0" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">и участника</text><rect x="70" y="650" width="330" height="160" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="235.0" y="681" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Расширение Яндекса</text><text x="235.0" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: TypeScript / MV3]</text><text x="235.0" y="738" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Ответы, баллы и награды</text><text x="235.0" y="761" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Системные уведомления</text><rect x="505" y="305" width="260" height="160" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="635.0" y="336" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Веб-сервер</text><text x="635.0" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: Next.js]</text><text x="635.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">HTML / JavaScript</text><text x="635.0" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Прокси /api/*</text><rect x="880" y="305" width="300" height="160" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="1030.0" y="336" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">API и обработчики</text><text x="1030.0" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: Go]</text><text x="1030.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Бизнес-правила</text><text x="1030.0" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Диспетчер и 2 обработчика</text><rect x="505" y="650" width="270" height="160" rx="14" fill="#f1e8d5" stroke="#668775" stroke-width="1.5"/><text x="640.0" y="681" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Очередь модерации</text><text x="640.0" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: Redis 7]</text><text x="640.0" y="738" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">ID заданий</text><text x="640.0" y="761" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">manyvo:moderation</text><rect x="880" y="650" width="300" height="160" rx="14" fill="#f1e8d5" stroke="#668775" stroke-width="1.5"/><text x="1030.0" y="681" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Основная база</text><text x="1030.0" y="707" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Контейнер: PostgreSQL 17]</text><text x="1030.0" y="738" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Опросы, ответы, баллы</text><text x="1030.0" y="761" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Купоны, события и задания</text><rect x="1250" y="305" width="260" height="160" rx="14" fill="#e5e8e5" stroke="#668775" stroke-width="1.5"/><text x="1380.0" y="336" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">OpenAI Moderation</text><text x="1380.0" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Внешняя система]</text><text x="1380.0" y="393" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Тексты и изображения</text><text x="1380.0" y="416" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">POST /v1/moderations</text><polyline points="400,360 505,360" fill="none" stroke="#557367" stroke-width="2"/><polygon points="505.0,360.0 494.0,364.0 494.0,356.0" fill="#557367"/><text x="452" y="340" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">HTTP /api</text><text x="452" y="397" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#20382f" text-anchor="middle">Cookie</text><text x="452" y="417" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#20382f" text-anchor="middle">+ CSRF</text><polyline points="400,730 450,730 450,430 505,430" fill="none" stroke="#557367" stroke-width="2"/><polygon points="505.0,430.0 494.0,434.0 494.0,426.0" fill="#557367"/><text x="520" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">HTTP /api</text><text x="520" y="561" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Bearer</text><polyline points="765,385 880,385" fill="none" stroke="#557367" stroke-width="2"/><polygon points="880.0,385.0 869.0,389.0 869.0,381.0" fill="#557367"/><text x="822" y="340" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">HTTP</text><text x="822" y="362" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">JSON</text><polyline points="1180,385 1250,385" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1250.0,385.0 1239.0,389.0 1239.0,381.0" fill="#557367"/><text x="1215" y="365" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">HTTPS</text><polyline points="1030,465 1030,650" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1030.0,650.0 1026.0,639.0 1034.0,639.0" fill="#557367"/><text x="1080" y="555" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">SQL / pgx</text><polyline points="930,465 930,580 640,580 640,650" fill="none" stroke="#557367" stroke-width="2"/><polygon points="640.0,650.0 636.0,639.0 644.0,639.0" fill="#557367"/><text x="776" y="562" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">LPUSH / BRPOP</text><text x="60" y="867" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#20382f" text-anchor="start">Пользователь открывает localhost:3000. Запросы /api/* идут Next.js → Go API.</text><text x="40" y="953" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#20382f" text-anchor="start">Обработчики — часть Go-процесса. Внешний вызов OpenAI выполняется только при DEMO_MODE=false.</text></svg>
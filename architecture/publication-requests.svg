<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2297" viewBox="0 0 1600 2297" role="img" aria-labelledby="title desc"><title id="title">Запросы — публикация и уведомление</title><desc id="desc">Последовательность запросов через Next.js, Go, PostgreSQL, Redis и OpenAI до расширения.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557367"/></marker></defs><rect width="1600" height="2297" fill="#f7f8f4"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20382f" text-anchor="start">Запросы — публикация и уведомление</text><line x1="130" y1="165" x2="130" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="40" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="130" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">Сайт</text><text x="130" y="143" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">заказчика</text><line x1="350" y1="165" x2="350" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="260" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="350" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">Next.js</text><line x1="590" y1="165" x2="590" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="500" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="590" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">Go API</text><text x="590" y="143" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">и обработчики</text><line x1="830" y1="165" x2="830" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="740" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="830" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">PostgreSQL</text><line x1="1050" y1="165" x2="1050" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="960" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="1050" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">Redis</text><line x1="1250" y1="165" x2="1250" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="1160" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="1250" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">OpenAI</text><line x1="1460" y1="165" x2="1460" y2="2187" stroke="#aebcaf" stroke-dasharray="5 6"/><rect x="1370" y="90" width="180" height="72" rx="10" fill="#dceccf" stroke="#7c9484"/><text x="1460" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#20382f" text-anchor="middle">Расширение</text><rect x="30" y="170" width="1540" height="37" rx="7" fill="#e8eddf"/><text x="48" y="194" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">ПУБЛИКАЦИЯ · запрос сайта</text><polyline points="130,265 350,265" fill="none" stroke="#557367" stroke-width="2"/><polygon points="350.0,265.0 339.0,269.0 339.0,261.0" fill="#557367"/><text x="240.0" y="228" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">POST /api/studies/</text><text x="240.0" y="249" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">{id}/publish · Cookie + CSRF</text><polyline points="350,344 590,344" fill="none" stroke="#557367" stroke-width="2"/><polygon points="590.0,344.0 579.0,348.0 579.0,340.0" fill="#557367"/><text x="470.0" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Проксировать запрос</text><polyline points="590,423 830,423" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,423.0 819.0,427.0 819.0,419.0" fill="#557367"/><text x="710.0" y="386" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">TX: moderating</text><text x="710.0" y="407" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">+ moderation_jobs</text><polyline points="590,502 350,502" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="350.0,502.0 361.0,498.0 361.0,506.0" fill="#557367"/><text x="470.0" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">JSON: moderating</text><polyline points="350,581 130,581" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="130.0,581.0 141.0,577.0 141.0,585.0" fill="#557367"/><text x="240.0" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Ожидание модерации</text><rect x="30" y="620" width="1540" height="37" rx="7" fill="#e8eddf"/><text x="48" y="644" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">МОДЕРАЦИЯ · фоновые обработчики Go</text><polyline points="590,715 830,715" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,715.0 819.0,719.0 819.0,711.0" fill="#557367"/><text x="710.0" y="693" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Найти задания для очереди</text><polyline points="590,794 1050,794" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1050.0,794.0 1039.0,798.0 1039.0,790.0" fill="#557367"/><text x="820.0" y="772" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">LPUSH: ID задания</text><polyline points="590,873 1050,873" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1050.0,873.0 1039.0,877.0 1039.0,869.0" fill="#557367"/><text x="820.0" y="851" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">BRPOP: получить задание</text><polyline points="1050,952 590,952" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="590.0,952.0 601.0,948.0 601.0,956.0" fill="#557367"/><text x="820.0" y="930" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">ID задания</text><polyline points="590,1031 830,1031" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,1031.0 819.0,1035.0 819.0,1027.0" fill="#557367"/><text x="710.0" y="994" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Загрузить версию задания</text><text x="710.0" y="1015" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Занять на 120 секунд</text><polyline points="590,1110 1250,1110" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1250.0,1110.0 1239.0,1114.0 1239.0,1106.0" fill="#557367"/><text x="920.0" y="1073" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">POST /v1/moderations · для каждого варианта</text><text x="920.0" y="1094" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Текст и изображение · DEMO_MODE=false</text><polyline points="1250,1189 590,1189" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="590.0,1189.0 601.0,1185.0 601.0,1193.0" fill="#557367"/><text x="920.0" y="1167" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Разрешение / запрет / ошибка</text><polyline points="590,1268 830,1268" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,1268.0 819.0,1272.0 819.0,1264.0" fill="#557367"/><text x="710.0" y="1231" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">TX: open + уведомления</text><text x="710.0" y="1252" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">либо draft + причина</text><rect x="30" y="1307" width="1540" height="37" rx="7" fill="#e8eddf"/><text x="48" y="1331" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">ДОСТАВКА · расширение проверяет события примерно раз в минуту</text><polyline points="1460,1402 350,1402" fill="none" stroke="#557367" stroke-width="2"/><polygon points="350.0,1402.0 361.0,1398.0 361.0,1406.0" fill="#557367"/><text x="905.0" y="1380" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">GET /api/extension/feed · Bearer</text><polyline points="350,1481 590,1481" fill="none" stroke="#557367" stroke-width="2"/><polygon points="590.0,1481.0 579.0,1485.0 579.0,1477.0" fill="#557367"/><text x="470.0" y="1459" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Проксировать запрос</text><polyline points="590,1560 830,1560" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,1560.0 819.0,1564.0 819.0,1556.0" fill="#557367"/><text x="710.0" y="1538" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">События и доступные опросы</text><polyline points="830,1639 590,1639" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="590.0,1639.0 601.0,1635.0 601.0,1643.0" fill="#557367"/><text x="710.0" y="1617" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Данные участника</text><polyline points="590,1718 350,1718" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="350.0,1718.0 361.0,1714.0 361.0,1722.0" fill="#557367"/><text x="470.0" y="1696" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">JSON</text><polyline points="350,1797 1460,1797" fill="none" stroke="#557367" stroke-width="2" stroke-dasharray="6 5"/><polygon points="1460.0,1797.0 1449.0,1801.0 1449.0,1793.0" fill="#557367"/><text x="905.0" y="1775" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">JSON: уведомления и доступные исследования</text><polyline points="1460,1856 1528,1856 1528,1881 1460,1881" fill="none" stroke="#557367" stroke-width="2"/><polygon points="1460.0,1881.0 1471.0,1877.0 1471.0,1885.0" fill="#557367"/><text x="1450" y="1844" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="end">chrome.notifications.create</text><rect x="30" y="1915" width="1540" height="37" rx="7" fill="#e8eddf"/><text x="48" y="1939" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#20382f" text-anchor="start">ПОДТВЕРЖДЕНИЕ · только после успешной передачи уведомления браузеру</text><polyline points="1460,2010 350,2010" fill="none" stroke="#557367" stroke-width="2"/><polygon points="350.0,2010.0 361.0,2006.0 361.0,2014.0" fill="#557367"/><text x="905.0" y="1988" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">POST /api/extension/ack · Bearer</text><polyline points="350,2089 590,2089" fill="none" stroke="#557367" stroke-width="2"/><polygon points="590.0,2089.0 579.0,2093.0 579.0,2085.0" fill="#557367"/><text x="470.0" y="2067" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Проксировать запрос</text><polyline points="590,2168 830,2168" fill="none" stroke="#557367" stroke-width="2"/><polygon points="830.0,2168.0 819.0,2172.0 819.0,2164.0" fill="#557367"/><text x="710.0" y="2131" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">Записать подтверждение</text><text x="710.0" y="2152" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#20382f" text-anchor="middle">notification_deliveries</text><text x="40" y="2227" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="start">DEMO_MODE=true: вызов OpenAI пропускается. Устаревшая версия задания не изменяет исследование.</text><text x="40" y="2258" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="start">При запрете или ошибке публикации нового опроса нет. Подтверждение доставки не означает «прочитано».</text></svg>
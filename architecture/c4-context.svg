<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc"><title id="title">C4 · L1 — Контекст Manyvo</title><desc id="desc">Заказчик и участник используют Manyvo. Manyvo обращается к OpenAI для модерации.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557367"/></marker></defs><rect width="1440" height="620" fill="#f7f8f4"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20382f" text-anchor="start">C4 · L1 — Контекст Manyvo</text><rect x="45" y="110" width="315" height="155" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="202.5" y="141" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Заказчик</text><text x="202.5" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Человек]</text><text x="202.5" y="198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Создаёт исследования</text><text x="202.5" y="221" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Сверяет прогноз с фактом</text><rect x="45" y="370" width="315" height="155" rx="14" fill="#dceccf" stroke="#668775" stroke-width="1.5"/><text x="202.5" y="401" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Участник</text><text x="202.5" y="427" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Человек]</text><text x="202.5" y="458" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Отвечает на два вопроса</text><text x="202.5" y="481" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Получает баллы и награды</text><rect x="570" y="240" width="370" height="170" rx="14" fill="#c5ddbc" stroke="#668775" stroke-width="1.5"/><text x="755.0" y="271" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">Manyvo</text><text x="755.0" y="297" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Программная система]</text><text x="755.0" y="328" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Прогнозные микроисследования</text><text x="755.0" y="351" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">для бизнеса</text><rect x="1100" y="240" width="300" height="170" rx="14" fill="#e5e8e5" stroke="#668775" stroke-width="1.5"/><text x="1250.0" y="271" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#20382f" text-anchor="middle">OpenAI Moderation API</text><text x="1250.0" y="297" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4a6658" text-anchor="middle">[Внешняя система]</text><text x="1250.0" y="328" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">Проверяет тексты</text><text x="1250.0" y="351" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#20382f" text-anchor="middle">и изображения</text><polyline points="360,187 470,187 470,280 570,280" fill="none" stroke="#557367" stroke-width="2"/><polygon points="570.0,280.0 559.0,284.0 559.0,276.0" fill="#557367"/><text x="465" y="133" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">Исследования</text><text x="465" y="155" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#20382f" text-anchor="middle">и отчёты</text><polyline points="360,447 470,447 470,370 570,370" fill="none" stroke="#557367" 
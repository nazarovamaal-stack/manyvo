services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manyvo
      POSTGRES_USER: manyvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manyvo-local-only}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manyvo -d manyvo"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://manyvo:${POSTGRES_PASSWORD:-manyvo-local-only}@postgres:5432/manyvo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "8080"
      BIND: "0.0.0.0"
      APP_ORIGIN: http://localhost:3000
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_ORIGIN: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
